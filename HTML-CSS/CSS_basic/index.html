        p {
            color: gray;
            font-family: 'Fira Code', sans-serif;
            font-size: 16px;
            /*16px es el predeterminado*/
            font-weight: lighter;
            font-style: italic;
            text-align: justify;
            text-decoration: underline;
            line-height: 1.125;
            letter-spacing: 1.5px;
            text-transform: capitalize;
            text-shadow: 0px 0px 3px #000;
        }
