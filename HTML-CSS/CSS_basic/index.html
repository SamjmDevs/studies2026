    <!--BOX-->
    <!--
    box-sizing: border-box;
    Se estira de manera general, no mantiene el tamaño; El ancho y el alto definen el contenido
    box-sizing: content-box;
    Se estira hasta el padding y luego hasta el borde, manteniendo el tamaño; El ancho y el alto definen la caja entera.
    -->
    <!--
    COLOR
    RGBA -> RED GREEN BLUE ALFA -> Del 0 al 255 cuanta cantidad de color va a tener cada capa, ALFA es la transparencia (por porcentajes o de 0 a 1 con decimales)
    HEX -> #XXYYZZ; -> del 00 al FF -> Cuanto rojo verda y azul por pares. Primer número del par (izquierda) color, segundo número del par (derecha) el tono.Si el par tiene el mismo valor en ambos, se puede usar solo 1, no vale mezclar, o #AAA; o #AA17BB; Si añades un cuarto par, es el ALFA, la opacidad.
    HSLA -> Hue, Saturation, Lightness, Alfa -> HSL (0 (rojo), 70%, 50%) y te da el color que patata
    url(htmlcolorcodes.com/color-picker/)
    -->
    <!--
    UNIDADES DE MEDIDA
    Píxeles -> px -> Medida absoluta
    Cms, mms, inch -> cm, mm, in -> Medidas absolutas y físicas (Más bien para impresión)
    Porcentaje -> % -> Medida relativa, depende de contenedores, tipografías, pantalla de visionado...
    Porcentaje en font-size da el % respecto al font-size del contenedor
    Porcentajes en margin -> Se mueve el % en la dirección especificada del total del tamaño de la caja padre.
    Em -> 1 em = font-size del elemento padre (o el predeterminado)
    Rem -> Igual que em pero busca el font-size del elemento raíz

    Medida de viewport
    vh -> viewport height -> la altura total disponible
    vw -> viewport width -> la anchura total disponible

    vmax -> vmax = 1vh o 1vw depende de la orientación. -> 1vmin = 1vw cuando es w es más pequeño que h. Y al contrario con vmax.

    Existe ex y ch, pero es de tipografía, explorar si place.

    Tipografía: em o rem.
    Layout: %, em, rem o vh/vw.
    Algo preciso o estable independiente de donde se mire, usamos px.
    -->
    <!--FONDOS-->
    <!--
    background-color: -> Añade color de fondo
    background-image: url("url de la imagen") -> pone la imagen como fondo del contenedor
    background-size: -> Ajusta el ancho de la imagen al ancho del contenedor para que encaje
    background-size: contain -> Obliga al contenedor a hacer que la imagen entre, la muestra entera al menos una vez
    Background-size: cover -> Hace que la imagen, independientemente de la rsolución, la imagen se adapte al contenedor,
    si se junta con background-position: X; centra la imagen al contenedor.
    background-repeat: no-repeat -> hace que la imagen aparezca solo una vez, que no se repita, no se cree el efecto mosaico.
    background-attachment: -> fixed-- fija la posición al fondo, el scroll no la modifica. Está puesto en scroll by default.
    background: url position / size(cover) attachment color => La barrita es obligatoria

    GRADIENTES
    background o background-image => linear-gradient(color1, color2) o transparent -> gradiente lineal vertical, linear-gradient(to right, color1, color 2) ahí hacemos que sea de izquierda hacia (to) la derecha.
    Podemos añadir más colores.
    Añadimos porcentajes tras los colores para añadir cuanto ocupe ese color.
    background: radial-gradient (mismas propiedades), hace efecto de mira o como cuando queda poca vida y los bordes de la pantalla se ponen rojos.
    background: conic-gradient -> va haciendo una vuelta de reloj haciendo el cambio a gradiente.

    SOMBRAS
    box-shadow: cuantos px se moverá hacia la derecha la sombra, cuantos px se moverá hacia abajo la sombra, cuanto desenfoque, cuanto se expande, color.
    text-shadow: funciona igual que box-shadow, mismas propiedades, mismo orden de propiedades, salvo la expansión
    filter: drop-shadow(Propiedades de la sombra) -> Para imágenes transparentes, solo para imágenes con canal alfa.

    -->
