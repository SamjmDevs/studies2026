<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Semántico</title>
</head>

<body>
    <!--ENCABEZADO-->
    <header>
        <nav>
            <ul></ul>
            <ul></ul>
            <ul></ul>
            <ul></ul>
        </nav>
    </header>
    <main>
        <!--MAIN es la sección principal-->
        <section>
            <!--SECTION son las secciones secundarias o subsecciones de la página-->
            <article>
                <!--ARTICLE son los artículos de la sección-->
            </article>
        </section>
    </main>
    <aside>
        <!--Sección adicional o secundaria, relacionada con el contenido del main-->
    </aside>
    <footer>
        <!--FOOTER es el pie de página-->
    </footer>
</body>

</html>
