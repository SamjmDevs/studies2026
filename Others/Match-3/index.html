<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match 3</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: antiquewhite;
            margin: 0;
            padding: 0;
            /* Ocupar exactamente la pantalla sin scroll */
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            /* Centrado absoluto del contenedor principal */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #container {
            background-color: grey;
            padding: 20px;
            border-radius: 8px;
            /* Grid para dividir tablero (izquierda) y displayer (derecha) */
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;

            /* Dimensiones máximas dentro del viewport */
            width: 90vw;
            height: 90vh;
            max-width: 1200px;
        }

        #board {
            background-color: lightgray;
            border: 1px solid lightslategray;
            border-radius: 4px;
            width: 100%;
            height: 100%;
            /* Flex o Grid interno para renderizar las fichas del Match-3 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #displayer {
            background-color: lightgray;
            border: 1px solid lightslategray;
            border-radius: 4px;
            width: 100%;
            height: 100%;
            /* Preparado para albergar la etiqueta <video> ajustada */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Estilo recomendado para el reproductor dentro del displayer */
        #displayer video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* o 'contain' según el tipo de vídeo */
        }
    </style>
</head>

<body>
    <div id="container" class="container">
        <div id="board" class="board">
            <!-- El tablero Match-3 se generará aquí mediante JS -->
        </div>
        <div id="displayer" class="displayer">
            <video id="reward-video" autoplay loop muted playsinline>
                <source src="intro.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <script>
        // 1. Configuración de los tramos de puntuación y sus vídeos
        const VIDEO_THRESHOLDS = [
            { score: 0, src: 'video_level_1.mp4', label: 'Nivel Inicial' },
            { score: 100, src: 'video_level_2.mp4', label: 'Primer Logro' },
            { score: 500, src: 'video_level_3.mp4', label: 'Racha Promedio' },
            { score: 1000, src: 'video_level_max.mp4', label: 'Puntuación Máxima' }
        ];

        // 2. Variables de estado del juego
        let currentScore = 0;
        let currentVideoSrc = '';

        // 3. Referencia al elemento DOM
        const rewardVideo = document.getElementById('reward-video');

        /**
         * Actualiza la puntuación del juego y evalúa si corresponde cambiar el vídeo.
         * @param {number} pointsToAdd - Puntos obtenidos en la última jugada.
         */
        function addScore(pointsToAdd) {
            currentScore += pointsToAdd;
            console.log(`Puntuación actual: ${currentScore}`);

            checkVideoThresholds(currentScore);
        }

        /**
         * Evalúa las flags/umbrales de puntuación y cambia la fuente del vídeo si procede.
         * @param {number} score - Puntuación actual del jugador.
         */
        function checkVideoThresholds(score) {
            // Buscamos el último umbral que la puntuación actual haya superado o igualado
            let targetConfig = VIDEO_THRESHOLDS[0];

            for (let i = VIDEO_THRESHOLDS.length - 1; i >= 0; i--) {
                if (score >= VIDEO_THRESHOLDS[i].score) {
                    targetConfig = VIDEO_THRESHOLDS[i];
                    break;
                }
            }

            // Cambiar de vídeo solo si el umbral alcanzado implica un archivo distinto al actual
            if (targetConfig.src !== currentVideoSrc) {
                changeVideo(targetConfig.src);
            }
        }

        /**
         * Carga y reproduce de forma segura el nuevo vídeo.
         * @param {string} newSrc - Ruta del vídeo a cargar.
         */
        function changeVideo(newSrc) {
            currentVideoSrc = newSrc;

            // Aplicar ligera transición o refresco de fuente
            rewardVideo.src = newSrc;
            rewardVideo.load();

            // Manejo de la promesa de reproducción por políticas de autoplay del navegador
            const playPromise = rewardVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.warn("La reproducción automática fue bloqueada o interrumpida:", error);
                });
            }
        }

        // Inicialización: cargar el vídeo por defecto (0 puntos)
        checkVideoThresholds(currentScore);
    </script>
</body>

</html>
