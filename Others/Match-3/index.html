<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match 3</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: antiquewhite;
            margin: 0;
            padding: 0;
            /* Ocupar exactamente la pantalla sin scroll */
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            /* Centrado absoluto del contenedor principal */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #container {
            background-color: grey;
            padding: 20px;
            border-radius: 8px;
            /* Grid para dividir tablero (izquierda) y displayer (derecha) */
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;

            /* Dimensiones máximas dentro del viewport */
            width: 90vw;
            height: 90vh;
            max-width: 1200px;
        }

        #board {
            background-color: lightgray;
            border: 1px solid lightslategray;
            border-radius: 4px;
            width: 100%;
            height: 100%;
            /* Flex o Grid interno para renderizar las fichas del Match-3 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #displayer {
            background-color: lightgray;
            border: 1px solid lightslategray;
            border-radius: 4px;
            width: 100%;
            height: 100%;
            /* Preparado para albergar la etiqueta <video> ajustada */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Estilo recomendado para el reproductor dentro del displayer */
        #displayer video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* o 'contain' según el tipo de vídeo */
        }
    </style>
</head>

<body>
    <div id="container" class="container">
        <div id="board" class="board">
            <!-- El tablero Match-3 se generará aquí mediante JS -->
        </div>
        <div id="displayer" class="displayer">
            <video id="reward-video" autoplay loop muted playsinline>
                <source src="intro.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <script>
        // Siguiente paso: Lógica de actualización del vídeo basada en la puntuación
    </script>
</body>

</html>
